<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walang Pasok Predictor - NCR</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <!-- LEFT SIDE: the big map -->
  <div class="poster">
    <h1>WALANG<br>PASOK</h1>
    <div class="for-day" id="forDay"></div>
    <div class="as-of" id="asOf"></div>
    <button class="small-btn" onclick="toggleNetwork()" id="networkBtn">Show network</button>
    <svg id="map"></svg>
    <div class="legend" id="legend"></div>
  </div>

  <!-- RIGHT SIDE: the controls -->
  <div class="side">

    <div class="box">
      <h2>1. Pick your level</h2>
      <select id="levelPick" onchange="changeLevel()">
        <option value="Kinder">Kinder</option>
        <option value="Grade 1-10" selected>Grade 1-10</option>
        <option value="Senior High">Senior High (11-12)</option>
        <option value="College">College</option>
      </select>
    </div>

    <div class="box">
      <h2>2. Weather in all of NCR</h2>
      <label>Wind signal
        <select id="allSignal">
          <option value="0">None</option><option value="1">Signal No. 1</option><option value="2">Signal No. 2</option>
          <option value="3">Signal No. 3</option><option value="4">Signal No. 4</option><option value="5">Signal No. 5</option>
        </select>
      </label>
      <label>Rain warning
        <select id="allRain">
          <option value="none">None</option><option value="yellow">Yellow (7.5-15 mm/hr)</option>
          <option value="orange">Orange (15-30 mm/hr)</option><option value="red">Red (over 30 mm/hr)</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="habagatBox" onchange="changeExtras()"> Strong habagat (pulled by a typhoon)</label>
      <label class="check"><input type="checkbox" id="continuesBox" onchange="changeExtras()"> Heavy rain will continue overnight</label>
      <button class="big-btn" onclick="applyToAll()">Apply to all 17 cities</button>
      <p class="hint">Or try a sample:</p>
      <button class="small-btn" onclick="sample('habagat')">Habagat + Orange rain</button>
      <button class="small-btn" onclick="sample('signal1')">Signal No. 1</button>
      <button class="small-btn" onclick="sample('yellow')">Yellow rain + Manila and QC announced</button>
      <button class="small-btn" onclick="sample('clear')">Clear all</button>
    </div>

    <div class="box">
      <h2 id="cityTitle">3. City</h2>
      <p class="hint">Click a city on the map to change its weather.</p>
      <label>Wind signal here
        <select id="citySignal" onchange="changeCity()">
          <option value="0">None</option><option value="1">Signal No. 1</option><option value="2">Signal No. 2</option>
          <option value="3">Signal No. 3</option><option value="4">Signal No. 4</option><option value="5">Signal No. 5</option>
        </select>
      </label>
      <label>Rain warning here
        <select id="cityRain" onchange="changeCity()">
          <option value="none">None</option><option value="yellow">Yellow</option><option value="orange">Orange</option><option value="red">Red</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="cityFloodWarning" onchange="changeCity()"> PAGASA flood warning (critical)</label>
      <label class="check"><input type="checkbox" id="cityFlooding" onchange="changeCity()"> Streets are flooded</label>
      <label class="check"><input type="checkbox" id="cityAnnounced" onchange="changeCity()"> Mayor already announced walang pasok</label>
    </div>

    <div class="box">
      <h2 id="resultTitle">Result</h2>
      <div class="result">
        <span class="percent" id="percent"></span>
        <span class="answer" id="answer"></span>
      </div>
      <ol id="steps"></ol>
    </div>

    <div class="box">
      <h2>How the system knows things</h2>
      <div class="tabs">
        <button onclick="openTab('frames')">Frames</button>
        <button onclick="openTab('network')">Network</button>
        <button onclick="openTab('logic')">Logic</button>
        <button onclick="openTab('rules')">Rules</button>
        <button onclick="openTab('procedure')">Procedure</button>
      </div>
      <div id="tabBox"></div>
    </div>

  </div>
</div>

<!-- The order GENUINELY matters here wag niyo na galawin: data first, then the brain, then the app -->
<script src="map-data.js"></script>
<script src="1-frames.js"></script>
<script src="2-network.js"></script>
<script src="3-logic.js"></script>
<script src="4-rules.js"></script>
<script src="5-procedure.js"></script>
<script src="app.js"></script>
</body>
</html>
